name: Build and Push Pod Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile.pod'
      - 'requirements.txt'
      - 'core/**'
      - 'api.py'
      - 'startup_pod.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag:
        description: 'Docker image tag (default: v1.0)'
        required: false
        default: 'v1.0'

env:
  DOCKER_IMAGE: upgraide/avatar-api-pod
  DEFAULT_TAG: v1.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ env.DEFAULT_TAG }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pod
          platforms: linux/amd64  # x86_64 architecture for RunPod
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Pod Docker Build Successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.tag.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/amd64 (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** Lightweight Pod image (~5GB, models external)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Create RunPod Pod with L40S GPU" >> $GITHUB_STEP_SUMMARY
          echo "2. Download models to /workspace/models (~236GB, one-time)" >> $GITHUB_STEP_SUMMARY
          echo "3. Run container: \`docker run --gpus all -v /workspace/models:/workspace/models ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See docs/POD_DEPLOYMENT.md for full instructions." >> $GITHUB_STEP_SUMMARY
